openapi: 3.0.3
info:
  title: Deer Profile API
  description: API endpoints for deer profile creation and management
  version: 1.0.0

paths:
  /api/deer:
    get:
      summary: List deer catalog
      description: Get all deer profiles for the authenticated user
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Search by deer name
      responses:
        '200':
          description: List of deer profiles
          content:
            application/json:
              schema:
                type: object
                properties:
                  deer:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeerWithSightings'
        '401':
          description: Unauthorized

    post:
      summary: Create deer profile
      description: Create a new deer profile from a detection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - detection_id
              properties:
                name:
                  type: string
                  minLength: 1
                  description: Name for the deer
                detection_id:
                  type: string
                  format: uuid
                  description: Detection to use as reference
                notes:
                  type: string
                  nullable: true
                  description: Optional notes
      responses:
        '201':
          description: Deer profile created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deer'
        '400':
          description: Validation error
        '401':
          description: Unauthorized

  /api/deer/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      summary: Get deer profile
      description: Get a deer profile with sightings (paginated)
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Items per page
      responses:
        '200':
          description: Deer profile with sightings
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/DeerWithSightings'
                  - type: object
                    properties:
                      sightings:
                        type: array
                        items:
                          $ref: '#/components/schemas/Sighting'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '401':
          description: Unauthorized
        '404':
          description: Deer not found

    patch:
      summary: Update deer profile
      description: Update deer name and/or notes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                notes:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Deer profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deer'
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '404':
          description: Deer not found

    delete:
      summary: Delete deer profile
      description: Delete a deer profile (unlinks detections)
      responses:
        '204':
          description: Deer profile deleted
        '401':
          description: Unauthorized
        '404':
          description: Deer not found

components:
  schemas:
    Deer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        name:
          type: string
        notes:
          type: string
          nullable: true
        reference_detection_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum: [watching, target, harvested]
        first_seen:
          type: string
          format: date-time
          nullable: true
        last_seen:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DeerWithSightings:
      allOf:
        - $ref: '#/components/schemas/Deer'
        - type: object
          properties:
            sighting_count:
              type: integer
            reference_image_url:
              type: string
              nullable: true

    Sighting:
      type: object
      properties:
        id:
          type: string
          format: uuid
        image_id:
          type: string
          format: uuid
        thumbnail_url:
          type: string
          nullable: true
        captured_at:
          type: string
          format: date-time
          nullable: true
        antler_points:
          type: integer
          nullable: true
        is_reference:
          type: boolean

    Pagination:
      type: object
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
